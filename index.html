<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Player companion for The Dark Sun Chronicles — character sheets, DSC classes, sessions, notes, and spell/equipment sync." />
  <title>Dark Sun Chronicles — Player Companion</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
        <div class="brand">
          <span class="brand-icon">☀</span>
          <div class="brand-text">
            <span class="brand-title">Dark Sun Chronicles</span>
            <span class="brand-sub">Player Companion</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <span id="active-campaign-badge" class="badge hidden"></span>
        <button id="dice-toggle" class="btn secondary" title="Dice roller">🎲</button>
        <button id="export-btn" class="btn ghost" title="Export data">Export</button>
        <button id="import-btn" class="btn ghost" title="Import data">Import</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </header>
    <aside id="sidebar" class="sidebar">
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="campaigns">
          <span class="nav-icon">📚</span> Campaigns
        </button>
        <button class="nav-item" data-view="sessions" disabled>
          <span class="nav-icon">📝</span> Sessions
        </button>
        <button class="nav-item" data-view="party" disabled>
          <span class="nav-icon">⚔️</span> Characters
        </button>
        <button class="nav-item" data-view="dsc-classes">
          <span class="nav-icon">🌙</span> DSC Classes
        </button>
        <button class="nav-item" data-view="notes" disabled>
          <span class="nav-icon">📒</span> Notes
        </button>
        <button class="nav-item" data-view="tools">
          <span class="nav-icon">🔧</span> Tools
        </button>
      </nav>
    </aside>
    <main id="main" class="main">
      <!-- views loaded by app.js; player shell keeps character-focused sections -->
      <div id="view-root"></div>
    </main>
  </div>
  <div id="dice-panel" class="dice-panel hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Modal</h2>
        <button id="modal-close" class="icon-btn" type="button">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn ghost" type="button">Cancel</button>
        <button id="modal-confirm" class="btn primary" type="button">Save</button>
      </div>
    </div>
  </div>
  <script src="js/bestiary-data.js"></script>
  <script src="js/phb-data.js"></script>
  <script src="js/equipment-data.js"></script>
  <script src="js/spells-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
